# Build Maven e Gradle su ogni pull request verso master o spring-upgrade, comprese quelle di Renovate
# (anche lanciato a mano con scripts/renovate-locale.sh): le due build devono restare valide e allineate
# (CLAUDE.md).
name: build

on:
  pull_request:
    branches: [master, spring-upgrade]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven
        run: mvn -B -ntp verify

      - name: Gradle
        run: ./gradlew build --no-daemon
