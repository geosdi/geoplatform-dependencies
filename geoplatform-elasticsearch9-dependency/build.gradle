plugins {
    id 'io.spring.dependency-management'
}

ext {
    elasticSearch9Version = "9.5.6";
    testcontainersVersion = "2.0.5";
}

dependencyManagement {
    dependencies {
        dependency ('co.elastic.clients:elasticsearch-java:' + elasticSearch9Version){
            exclude 'com.fasterxml.jackson.core:jackson-core'
            exclude 'com.fasterxml.jackson.core:jackson-databind'
        }
        dependency 'co.elastic.clients:elasticsearch-rest5-client:' + elasticSearch9Version
        dependency 'org.testcontainers:testcontainers:' + testcontainersVersion
        dependency 'org.testcontainers:testcontainers-elasticsearch:' + testcontainersVersion
        dependency 'org.testcontainers:testcontainers-junit-jupiter:' + testcontainersVersion
    }
}
